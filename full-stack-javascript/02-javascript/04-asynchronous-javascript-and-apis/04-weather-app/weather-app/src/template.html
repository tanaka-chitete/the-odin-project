<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <title>Jupiter</title>
  </head>
  <body>
    <div id="root">
      <header></header>

        <div class="summary">
          <p class="summary__location"></p>
          <p class="summary__temperature"></p>
          <p class="summary__conditions"></p>
        </div>

      <main>

              <div class="hour-forecast">
                <h4 class="hour-forecast__time"></h4>

              </div>

                ></span>

              </div>
              <div class="hour-forecast">

                <span
                  class="material-symbols-outlined hour-forecast__icon"
                ></span>
                <h4 class="hour-forecast__temperature"></h4>
              </div>
              <div class="hour-forecast">
                <h4 class="hour-forecast__time"></h4>
                <span

                ></span>
                <h4 class="hour-forecast__temperature"></h4>
              </div>
              <div class="hour-forecast">
                <h4 class="hour-forecast__time"></h4>
                <span

                ></span>

              </div>
              <div class="hour-forecast">

                <span

                ></span>
                <h4 class="hour-forecast__temperature"></h4>
              </div>
              <div class="hour-forecast">
                <h4 class="hour-forecast__time"></h4>
                <span
                  class="material-symbols-outlined hour-forecast__icon"
                ></span>
                <h4 class="hour-forecast__temperature"></h4>
              </div>
            </div>
          </div>

          <div class="tile tile_type_week-forecast">
            <h4 class="tile_heading">10-Day Forecast</h4>
            <hr class="tile__separator" />
          </div>

          <div class="tile tile_feels-like">
            <h4 class="tile_heading">Feels Like</h4>
            <hr class="tile__separator" />
          </div>

          <div class="tile tile_average-temperature">
            <h4 class="tile_heading">Average</h4>
            <hr class="tile__separator" />
          </div>

          <div class="tile tile_uv-index">
            <h4 class="tile_heading">UV Index</h4>
            <hr class="tile__separator" />
          </div>

          <div class="tile tile_wind-speed">
            <h4 class="tile_heading">Wind Speed</h4>
            <hr class="tile__separator" />

          <div class="tile tile_sunrise-time">
