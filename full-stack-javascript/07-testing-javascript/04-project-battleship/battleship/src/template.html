              <td class="sea__data" data-x="3" data-y="2"></td>

            </tr>
          </table>
          <div class="console">
            <div class="console__panel console__panel_type_game-start">
              <button
                type="button"
                class="console__button console__button_type_start-deployment"
              >
                Start
              </button>
            </div>

            <div class="console__panel console__panel_type_placement hidden">
              <button
                type="button"
                class="console__button console__button_type_clear-ships"
              >
                Clear
              </button>
              <button
                type="button"
                class="console__button console__button_type_rotate-ship"
              >
                Rotate
              </button>
              <button
                type="button"
                class="console__button console__button_type_end-placement"
              >
                End
              </button>
            </div>

            <div class="console__panel console__panel_type_engagement hidden">
              <button
                type="button"
                class="console__button console__button_type_launch-missile"
              >
                Launch
              </button>
              <button
                type="button"
                class="console__button console__button_type_end-engagement"
              >
                End
              </button>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <p>
          Developed by
          <a href="https://www.linkedin.com/in/tanaka-chitete/" target="_blank"
