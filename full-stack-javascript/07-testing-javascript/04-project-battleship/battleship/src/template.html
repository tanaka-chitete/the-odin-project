<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <title>Battleship</title>
  </head>
  <body>
    <div id="root">
      <header>
        <h1>Battleship</h1>
        <h3 class="message"></h3>
      </header>

      <main>
        <div class="left">
          <div class="dock"></div>
        </div>

        <div class="middle">
          <table class="board"></table>

          <div class="controls controls_type_start">
            <button type="button" class="button button_type_start">
              Start
            </button>
          </div>

          <div class="controls controls_type_place" hidden>
            <button type="button" class="button button_type_reset">
              Reset
            </button>
            <button type="button" class="button button_type_rotate">
              Rotate
            </button>
            <button type="button" class="button button_type_submit">
              Submit
            </button>
          </div>

          <div class="controls controls_type_fire" hidden>
            <button type="button" class="button button_type_fire">Fire</button>
          </div>
        </div>
      </main>

      <footer>
        <p>Developed by Tanaka Chitete</p>
      </footer>
    </div>
  </body>
</html>
